<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AJK Election Live Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">آزاد جموں و کشمیر</p>
      <h1>الیکشن لائیو اپڈیٹس</h1>
      <p class="sub">سرکاری ذرائع کو ترجیح دیتے ہوئے مختلف ویب سائٹس سے تازہ معلومات</p>
    </div>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">لوڈ ہو رہا ہے…</span>
    </div>
  </header>

  <main>
    <section class="controls">
      <input id="search" type="search" placeholder="حلقہ، امیدوار یا شہر تلاش کریں" />
      <select id="sourceFilter">
        <option value="">تمام ذرائع</option>
      </select>
      <button id="refreshBtn">ابھی ریفریش کریں</button>
    </section>

    <section class="meta">
      <span id="lastUpdated">آخری اپڈیٹ: —</span>
      <span id="count">0 اپڈیٹس</span>
    </section>

    <section id="alerts"></section>
    <section id="feed" class="feed"></section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="cardTop">
        <span class="badge"></span>
        <time></time>
      </div>
      <h2></h2>
      <p></p>
      <div class="cardBottom">
        <span class="source"></span>
        <a target="_blank" rel="noopener">اصل خبر / نتیجہ</a>
      </div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
